services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-384m}
    pids_limit: 256
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-96MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-20}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobradar} -d ${POSTGRES_DB:-jobradar}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-256m}
    pids_limit: 256
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobradar}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      CONFIG_DIR: ${CONFIG_DIR:-config}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  ingest:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    profiles:
      - manual
    restart: "no"
    mem_limit: ${INGEST_MEM_LIMIT:-384m}
    pids_limit: 256
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobradar}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      CONFIG_DIR: ${CONFIG_DIR:-config}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.cli", "ingest"]
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
