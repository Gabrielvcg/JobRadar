name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobradar_test
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar_test
      POSTGRES_TEST_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar_test
      JOBRADAR_EXPORT_TEST_POSTGRES_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar_test
      JOBRADAR_SCHEDULER_TEST_POSTGRES_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar_test
      CONFIG_DIR: config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/build.txt
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.txt
          python -c 'from setuptools.build_meta import build_wheel; build_wheel("dist")'
          python -m pip install --only-binary=:all: --no-index --no-deps --find-links=dist jobradar==0.1.51
          python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app tests
      - name: App-only update and rollback procedure (synthetic)
        run: bash scripts/test-app-update.sh
      - name: Migration compatibility on disposable database
        run: |
          alembic upgrade head
          alembic downgrade 0002_add_user_accounts
          alembic upgrade head
      - name: Pytest (all PostgreSQL gates enabled)
        run: |
          pytest --junitxml=test-results.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('test-results.xml'); assert not list(r.iter('skipped')), 'Unexpected skipped release gate'"
      - name: Docker build
        env:
          REVISION: ${{ github.sha }}
        run: |
          context="$RUNNER_TEMP/jobradar-build"
          mkdir "$context"
          git archive HEAD | tar -x -C "$context"
          docker build --build-arg APP_REVISION="$REVISION" \
            --label org.opencontainers.image.revision="$REVISION" -t jobradar:ci "$context"
      - name: Save verified app image
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir image-artifact
          docker image inspect jobradar:ci > image-artifact/image-inspect.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          image = json.loads(Path('image-artifact/image-inspect.json').read_text())[0]
          revision = os.environ['REVISION']
          assert image['Architecture'] == 'amd64' and image['Os'] == 'linux'
          assert image['Config']['Labels']['org.opencontainers.image.revision'] == revision
          assert 'APP_REVISION=' + revision in image['Config']['Env']
          allowed = {'PATH', 'LANG', 'GPG_KEY', 'PYTHON_VERSION', 'PYTHON_SHA256',
                     'APP_REVISION', 'PYTHONDONTWRITEBYTECODE', 'PYTHONUNBUFFERED',
                     'PIP_NO_CACHE_DIR'}
          assert all(value.split('=', 1)[0] in allowed for value in image['Config']['Env'])
          Path('image-artifact/source.txt').write_text(revision + '\n')
          Path('image-artifact/image-id.txt').write_text(image['Id'] + '\n')
          PY
          docker save jobradar:ci | gzip > image-artifact/jobradar-image.tar.gz
          cd image-artifact
          sha256sum jobradar-image.tar.gz image-inspect.json source.txt image-id.txt > SHA256SUMS
      - name: Retain app image for operator delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jobradar-image-${{ github.sha }}
          path: image-artifact/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
