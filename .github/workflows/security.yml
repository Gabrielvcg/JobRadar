name: Dependency security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/build.txt
          python -m pip install --only-binary=:all: --require-hashes -r requirements/development.txt
          python -m pip install --no-index --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check

      - name: Audit project dependencies
        run: pip-audit --local --skip-editable
