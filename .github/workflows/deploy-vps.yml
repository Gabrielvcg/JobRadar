name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jobradar
  APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/jobradar' }}
  APP_PORT: ${{ vars.VPS_APP_PORT || '8000' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Copy VPS files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "infra/vps/docker-compose.prod.yml,infra/vps/.env.prod.example,infra/vps/deploy.sh,infra/vps/install-cron.sh,infra/vps/install-user-cron.sh,infra/vps/backup-postgres.sh,infra/vps/check-health.sh,infra/vps/create-user.sh,infra/vps/nginx-jobradar.conf"
          target: ${{ env.APP_DIR }}
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          APP_PORT: ${{ env.APP_PORT }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          POSTGRES_PASSWORD: ${{ secrets.VPS_POSTGRES_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.VPS_APP_SECRET_KEY }}
          PUBLIC_REGISTRATION_ENABLED: ${{ vars.VPS_PUBLIC_REGISTRATION_ENABLED || 'false' }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,APP_IMAGE,APP_PORT,GHCR_READ_TOKEN,GHCR_USER,POSTGRES_PASSWORD,APP_SECRET_KEY,PUBLIC_REGISTRATION_ENABLED,ADZUNA_APP_ID,ADZUNA_APP_KEY
          script: |
            set -euo pipefail
            mkdir -p "$APP_DIR/logs" "$APP_DIR/backups"
            cd "$APP_DIR"

            if [ -n "${GHCR_READ_TOKEN:-}" ]; then
              echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            cat > .env.prod <<EOF
            APP_ENV=production
            LOG_LEVEL=INFO
            APP_IMAGE=$APP_IMAGE
            APP_PORT=$APP_PORT
            APP_SECRET_KEY=$APP_SECRET_KEY
            SESSION_COOKIE_SECURE=true
            PUBLIC_REGISTRATION_ENABLED=$PUBLIC_REGISTRATION_ENABLED
            POSTGRES_DB=jobradar
            POSTGRES_USER=jobradar
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            APP_MEM_LIMIT=256m
            INGEST_MEM_LIMIT=384m
            DB_MEM_LIMIT=384m
            POSTGRES_SHARED_BUFFERS=96MB
            POSTGRES_WORK_MEM=4MB
            POSTGRES_MAINTENANCE_WORK_MEM=64MB
            POSTGRES_MAX_CONNECTIONS=20
            CONFIG_DIR=config
            HTTP_TIMEOUT_SECONDS=15
            ADZUNA_APP_ID=$ADZUNA_APP_ID
            ADZUNA_APP_KEY=$ADZUNA_APP_KEY
            MAX_MEM_PERCENT=80
            EOF

            chmod +x deploy.sh install-cron.sh install-user-cron.sh backup-postgres.sh check-health.sh create-user.sh
            APP_DIR="$APP_DIR" ./deploy.sh
            sudo APP_DIR="$APP_DIR" ./install-cron.sh
