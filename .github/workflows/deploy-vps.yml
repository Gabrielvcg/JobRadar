name: Deploy VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  packages: write

concurrency:
  group: jobradar-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$REVISION/check-runs" > /tmp/checks.json
          python - <<'PY'
          import json
          checks = json.load(open('/tmp/checks.json'))['check_runs']
          for name in ('quality', 'Audit Python dependencies'):
              matching = [c for c in checks if c['name'] == name]
              assert matching and max(matching, key=lambda c: c['id'])['conclusion'] == 'success', name
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jobradar" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Copy update procedure only
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: infra/vps/deploy.sh
          target: ${{ vars.VPS_APP_DIR || '/home/vacaro/jobradar' }}
          strip_components: 2
      - name: Update existing app only
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.VPS_APP_DIR || '/home/vacaro/jobradar' }}
          APP_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APP_DIR,APP_IMAGE,EXPECTED_REVISION
          script: |
            set -eu
            bash "$APP_DIR/deploy.sh"
